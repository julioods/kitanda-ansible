---
- name: Pré-checagens
  ansible.builtin.import_tasks: preflight.yml
  tags: [preflight]

- name: Diretórios de log
  ansible.builtin.import_tasks: dirs.yml
  tags: [dirs]

- name: Migração dos logs
  ansible.builtin.import_tasks: migrate.yml
  when: kitanda_logs_migrate | bool
  tags: [migrate]

- name: Ajuste do Compose
  ansible.builtin.import_tasks: compose.yml
  tags: [compose]

- name: Logrotate
  ansible.builtin.import_tasks: logrotate.yml
  tags: [logrotate]

- name: Aplicar mudanças pendentes antes de validar
  ansible.builtin.meta: flush_handlers

- name: Pós-validação
  ansible.builtin.import_tasks: validate.yml
  when: not ansible_check_mode
  tags: [validate]

- name: Limpeza dos logs antigos
  ansible.builtin.import_tasks: cleanup.yml
  when: (kitanda_logs_cleanup_old | bool) and not ansible_check_mode
  tags: [cleanup]
