---
kitanda_logs_compose_dir: /opt/kitanda
kitanda_logs_compose_file: compose.yaml
kitanda_logs_dir: /var/log/kitanda
kitanda_logs_old_dir: /srv/data/log
kitanda_logs_data_mount: /srv/data

# Serviços recriados quando o compose muda
kitanda_logs_services:
  - nginx
  - promtail
  - worker

# Containers verificados na pós-validação
kitanda_logs_containers:
  - kitanda-nginx
  - kitanda-promtail
  - kitanda-worker
  - kitanda-postgres
  - kitanda-api-1
  - kitanda-api-2
kitanda_logs_nginx_container: kitanda-nginx
kitanda_logs_promtail_container: kitanda-promtail

# Se informado, o positions do Promtail é movido para o caminho persistente
kitanda_logs_promtail_config: ""

kitanda_logs_rotate_keep: 3

# Migração e limpeza
kitanda_logs_migrate: true
kitanda_logs_cleanup_old: false   # destrutivo: só ligar após validar
kitanda_logs_space_margin: 1.3    # espaço livre exigido = tamanho dos logs * margem

# Pós-validação
kitanda_logs_promtail_window: 5m
kitanda_logs_data_max_use_pct: 85
