---
# O IP vem da variável de ambiente KITANDA_HOST (nenhum IP real no repositório).
# Local:  export KITANDA_HOST=x.x.x.x
# CI:     secret KITANDA_HOST do GitHub Environment "hml"
all:
  children:
    kitanda_app:
      hosts:
        kitanda-app-hml:
          ansible_host: "{{ lookup('ansible.builtin.env', 'KITANDA_HOST') }}"
      vars:
        ansible_port: 2200
        ansible_user: root
