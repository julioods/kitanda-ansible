---
name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: yamllint
        run: yamllint .
      - name: ansible-lint
        run: ansible-lint
      - name: Syntax check
        run: |
          ansible-playbook -i inventories/hml/hosts.yml playbooks/site.yml --syntax-check
          ansible-playbook -i inventories/hml/hosts.yml playbooks/rollback.yml --syntax-check
